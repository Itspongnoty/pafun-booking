<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLATFORM PAFUN</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .house{transition:transform .1s} .house:hover{transform:translateY(-2px)}
  .layout{display:grid;grid-template-columns:repeat(6,minmax(84px,1fr));gap:10px;min-width:560px}
</style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">

<!-- ============ CONFIG: paste your Apps Script Web App URL ============ -->
<script>const API_URL = 'https://script.google.com/macros/s/AKfycbxHPklVS_kgxI6ZXWiBhFS-S5gb87c1WeWD8uvp4A91opm1i3ejHTk3Bze2DCiYP-Ww8g/exec';</script>

<!-- Login screen (shown until the backend accepts the credentials) -->
<div id="loginView" class="hidden min-h-screen flex items-center justify-center p-4">
  <form id="loginForm" class="bg-white rounded-lg shadow w-full max-w-sm p-6 space-y-3">
    <div class="flex justify-end">
      <div class="flex rounded overflow-hidden border border-emerald-300 bg-emerald-800 text-sm">
        <button type="button" data-lang="th" class="px-2 py-1">ไทย</button>
        <button type="button" data-lang="en" class="px-2 py-1">EN</button>
      </div>
    </div>
    <h1 class="text-xl font-bold text-emerald-800 text-center">PLATFORM PAFUN</h1>
    <p class="text-center text-sm text-stone-500" data-i18n="loginTitle"></p>
    <label class="block text-sm"><span data-i18n="username"></span>
      <input id="lUser" required autocomplete="username" class="mt-1 w-full border rounded px-2 py-1"></label>
    <label class="block text-sm"><span data-i18n="password"></span>
      <input id="lPass" type="password" required autocomplete="current-password" class="mt-1 w-full border rounded px-2 py-1"></label>
    <p id="loginErr" class="hidden text-sm text-red-600"></p>
    <button id="loginBtn" class="w-full py-2 rounded bg-emerald-700 text-white font-semibold" data-i18n="loginBtn"></button>
  </form>
</div>

<div id="app" class="hidden">
<header class="bg-emerald-800 text-white px-4 py-3 shadow">
  <div class="max-w-4xl mx-auto flex flex-wrap items-center gap-3 justify-between">
    <h1 class="text-xl font-bold tracking-wide">PLATFORM PAFUN <span class="font-normal text-emerald-200 text-sm">Pafun Cottage</span></h1>
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex rounded overflow-hidden border border-emerald-300 text-sm" role="group" aria-label="Language">
        <button data-lang="th" type="button" class="px-2 py-1">ไทย</button>
        <button data-lang="en" type="button" class="px-2 py-1">EN</button>
      </div>
      <input id="dateSel" type="date" class="rounded px-2 py-1 text-stone-900">
      <span id="bedBadge" class="bg-amber-300 text-stone-900 text-sm font-semibold rounded-full px-3 py-1"></span>
      <button id="maintOpen" type="button" class="text-sm bg-yellow-400 text-stone-900 font-semibold rounded px-2 py-1" data-i18n="maintBtn"></button>
      <button id="logoutBtn" type="button" class="text-sm border border-emerald-300 rounded px-2 py-1" data-i18n="logout"></button>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto p-4">
  <div id="msg" class="hidden mb-3 rounded px-3 py-2 text-sm"></div>
  <div class="flex gap-4 text-sm mb-3">
    <span><i class="inline-block w-3 h-3 rounded bg-emerald-500 align-middle"></i> <span data-i18n="available"></span></span>
    <span><i class="inline-block w-3 h-3 rounded bg-red-500 align-middle"></i> <span data-i18n="booked"></span></span>
    <span><i class="inline-block w-3 h-3 rounded bg-yellow-400 align-middle"></i> <span data-i18n="repairLegend"></span></span>
  </div>
  <div class="overflow-x-auto"><div id="layout" class="layout"></div></div>
</main>
</div><!-- /#app -->

<!-- Booking form modal -->
<div id="formModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-10">
  <form id="bookForm" class="bg-white rounded-lg w-full max-w-md p-5 space-y-3 max-h-full overflow-y-auto">
    <h2 id="formTitle" class="text-lg font-bold" data-i18n="newBooking"></h2>
    <label class="block text-sm"><span data-i18n="name"></span> *<input name="customer_name" required class="mt-1 w-full border rounded px-2 py-1"></label>
    <label class="block text-sm"><span data-i18n="phone"></span> *<input name="phone_number" required inputmode="tel" class="mt-1 w-full border rounded px-2 py-1"></label>
    <label class="block text-sm"><span data-i18n="house"></span>
      <select name="house_number" class="mt-1 w-full border rounded px-2 py-1"></select></label>
    <div class="grid grid-cols-2 gap-2">
      <label class="block text-sm"><span data-i18n="ciDate"></span><input type="date" name="check_in_date" required class="mt-1 w-full border rounded px-2 py-1"></label>
      <label class="block text-sm"><span data-i18n="ciTime"></span><input type="time" name="check_in_time" value="14:00" required class="mt-1 w-full border rounded px-2 py-1"></label>
      <label class="block text-sm"><span data-i18n="coDate"></span><input type="date" name="check_out_date" required class="mt-1 w-full border rounded px-2 py-1"></label>
      <label class="block text-sm"><span data-i18n="coTime"></span><input type="time" name="check_out_time" value="11:00" required class="mt-1 w-full border rounded px-2 py-1"></label>
    </div>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="extra_bed" id="extraBed"> <span data-i18n="extraBed"></span> <span id="extraHint" class="text-stone-500"></span></label>
    <label class="block text-sm"><span data-i18n="purpose"></span><textarea name="purpose" rows="2" class="mt-1 w-full border rounded px-2 py-1"></textarea></label>
    <p id="formErr" class="hidden text-sm text-red-600"></p>
    <div class="flex items-center justify-between gap-2">
      <button type="button" id="toRepairBtn" class="text-sm text-yellow-700 underline text-left" data-i18n="markRepair"></button>
      <div class="flex gap-2">
        <button type="button" data-close class="px-3 py-1 rounded border" data-i18n="cancel"></button>
        <button id="saveBtn" class="px-4 py-1 rounded bg-emerald-700 text-white" data-i18n="save"></button>
      </div>
    </div>
  </form>
</div>

<!-- Maintenance (repair) modal -->
<div id="maintModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-10">
  <form id="maintForm" class="bg-white rounded-lg w-full max-w-md p-5 space-y-3 max-h-full overflow-y-auto">
    <h2 id="maintTitle" class="text-lg font-bold" data-i18n="maintTitle"></h2>
    <label class="block text-sm"><span data-i18n="house"></span> *
      <select name="house_number" required class="mt-1 w-full border rounded px-2 py-1"></select></label>
    <div class="grid grid-cols-2 gap-2">
      <label class="block text-sm"><span data-i18n="startDate"></span><input type="date" name="start_date" required class="mt-1 w-full border rounded px-2 py-1"></label>
      <label class="block text-sm"><span data-i18n="endDate"></span><input type="date" name="end_date" required class="mt-1 w-full border rounded px-2 py-1"></label>
    </div>
    <label class="block text-sm"><span data-i18n="repairNote"></span><textarea name="note" rows="2" class="mt-1 w-full border rounded px-2 py-1"></textarea></label>
    <p id="maintErr" class="hidden text-sm text-red-600"></p>
    <div class="flex justify-end gap-2">
      <button type="button" data-close class="px-3 py-1 rounded border" data-i18n="cancel"></button>
      <button id="maintSave" class="px-4 py-1 rounded bg-yellow-500 text-stone-900 font-semibold" data-i18n="save"></button>
    </div>
  </form>
</div>

<!-- Details modal -->
<div id="detailModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-10">
  <div class="bg-white rounded-lg w-full max-w-sm p-5 space-y-2">
    <h2 id="dTitle" class="text-lg font-bold"></h2>
    <dl id="dBody" class="text-sm grid grid-cols-[110px_1fr] gap-y-1"></dl>
    <p id="cancelErr" class="hidden text-sm text-red-600"></p>
    <div class="flex justify-between pt-2">
      <button id="cancelBtn" type="button" class="px-3 py-1 rounded bg-red-600 text-white" data-i18n="cancelBooking"></button>
      <div class="flex gap-2">
        <button id="editBtn" type="button" class="px-3 py-1 rounded bg-sky-600 text-white" data-i18n="edit"></button>
        <button data-close class="px-3 py-1 rounded border" data-i18n="close"></button>
      </div>
    </div>
  </div>
</div>

<script>
const MAX_EXTRA = 2;

/* ---------- Translations (default: Thai) ---------- */
const I18N = {
  th: {
    available:'ว่าง', booked:'จองแล้ว (คืนของวันที่เลือก)', office:'ออฟฟิศ', walkway:'— ทางเดิน —',
    beds:'เตียงเสริมที่ว่าง', house:'บ้านเลขที่', houseWord:'บ้าน', unassigned:'ยังไม่ระบุ',
    single:'เตียงเดี่ยว', double:'เตียงคู่', special:'ห้องพิเศษ',
    newBooking:'จองใหม่', name:'ชื่อลูกค้า', phone:'เบอร์โทรศัพท์',
    ciDate:'วันเช็คอิน', ciTime:'เวลาเช็คอิน', coDate:'วันเช็คเอาท์', coTime:'เวลาเช็คเอาท์',
    extraBed:'เตียงเสริม', leftFor:'เหลือ {n}/{m} ในช่วงวันที่เลือก', purpose:'วัตถุประสงค์ / หมายเหตุ',
    cancel:'ยกเลิก', save:'บันทึก', saving:'กำลังบันทึก…', close:'ปิด',
    checkIn:'เช็คอิน', checkOut:'เช็คเอาท์', yes:'ใช่', no:'ไม่',
    saved:'บันทึกการจองแล้ว: ', loadFail:'โหลดข้อมูลการจองไม่ได้: ',
    loginTitle:'เข้าสู่ระบบผู้ดูแล', username:'ชื่อผู้ใช้', password:'รหัสผ่าน', loginBtn:'เข้าสู่ระบบ', signingIn:'กำลังเข้าสู่ระบบ…',
    logout:'ออกจากระบบ', loginFail:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', sessionExpired:'หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบอีกครั้ง',
    cancelBooking:'ยกเลิกการจอง', confirmCancel:'ยืนยันการยกเลิกการจองนี้? การกระทำนี้ลบข้อมูลการจองและย้อนกลับไม่ได้', cancelling:'กำลังยกเลิก…', cancelled:'ยกเลิกการจองแล้ว: ',
    outdated:'Backend (Code.gs) ยังเป็นเวอร์ชันเก่า: ไปที่ Deploy → Manage deployments → Edit → New version แล้วรีเฟรชหน้านี้',
    editBooking:'แก้ไขการจอง', repairLegend:'ปิดซ่อม', maintBtn:'🔧 แจ้งปิดซ่อม', maintTitle:'แจ้งปิดซ่อมห้อง', editMaint:'แก้ไขการปิดซ่อม',
    startDate:'วันเริ่มซ่อม', endDate:'วันสิ้นสุดซ่อม (นับรวม)', repairNote:'สิ่งที่ซ่อม / หมายเหตุ', markRepair:'ปิดซ่อมห้องนี้แทน',
    selectHouse:'เลือกบ้าน', repairLabel:'ปิดซ่อม', status:'สถานะ', cancelMaint:'ยกเลิกการปิดซ่อม',
    confirmMaint:'ยกเลิกช่วงปิดซ่อมนี้? ห้องจะกลับมาว่างในช่วงวันดังกล่าว', maintSaved:'บันทึกการปิดซ่อมแล้ว: ',
    maintUpdated:'อัปเดตการปิดซ่อมแล้ว: ', maintDeleted:'ยกเลิกการปิดซ่อมแล้ว: ', startLbl:'เริ่ม', endLbl:'สิ้นสุด', edit:'แก้ไข', updated:'อัปเดตการจองแล้ว: ',
    badResponse:'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง ตรวจสอบ API_URL (ต้องเป็นลิงก์ /exec ของ Web App เวอร์ชันล่าสุด) และสิทธิ์เข้าถึงเป็น "Anyone"'
  },
  en: {
    available:'Available', booked:'Booked (night of selected date)', office:'Office', walkway:'— walkway —',
    beds:'Available Extra Beds', house:'House Number', houseWord:'House', unassigned:'Unassigned',
    single:'Single Bed', double:'Double Bed', special:'Special Room',
    newBooking:'New Booking', name:'Customer Name', phone:'Phone Number',
    ciDate:'Check-in Date', ciTime:'Check-in Time', coDate:'Check-out Date', coTime:'Check-out Time',
    extraBed:'Extra bed', leftFor:'{n}/{m} left for these dates', purpose:'Purpose / Notes',
    cancel:'Cancel', save:'Save', saving:'Saving…', close:'Close',
    checkIn:'Check-in', checkOut:'Check-out', yes:'Yes', no:'No',
    saved:'Booking saved: ', loadFail:'Could not load bookings: ',
    loginTitle:'Admin Login', username:'Username', password:'Password', loginBtn:'Log in', signingIn:'Signing in…',
    logout:'Logout', loginFail:'Incorrect username or password', sessionExpired:'Session expired. Please log in again.',
    cancelBooking:'Cancel booking', confirmCancel:'Cancel this booking? This deletes the booking and cannot be undone.', cancelling:'Cancelling…', cancelled:'Booking cancelled: ',
    outdated:'Backend (Code.gs) is outdated: go to Deploy → Manage deployments → Edit → New version, then reload this page.',
    editBooking:'Edit Booking', repairLegend:'Under repair', maintBtn:'🔧 Mark repair', maintTitle:'Mark House Under Repair', editMaint:'Edit Repair Period',
    startDate:'Repair start date', endDate:'Repair end date (inclusive)', repairNote:'What is being fixed / Notes', markRepair:'Mark this house as under repair instead',
    selectHouse:'Select house', repairLabel:'Under repair', status:'Status', cancelMaint:'Cancel repair period',
    confirmMaint:'Cancel this repair period? The house becomes available for these dates.', maintSaved:'Repair period saved: ',
    maintUpdated:'Repair period updated: ', maintDeleted:'Repair period cancelled: ', startLbl:'Start', endLbl:'End', edit:'Edit', updated:'Booking updated: ',
    badResponse:'Invalid server response. Check API_URL (must be the latest Web App /exec link) and that access is set to "Anyone".'
  }
};
let lang = 'th';
try { const s = localStorage.getItem('pafun_lang'); if (s === 'en' || s === 'th') lang = s; } catch (e) {}
const t = k => I18N[lang][k];
const TYPES = n => t(n <= 7 ? 'single' : n <= 11 ? 'double' : 'special');

// Grid cell per house, mirroring the layout plan (col,row)
const POS = {1:[6,2], 2:[6,3], 8:[1,3], 9:[2,3], 10:[3,3], 11:[4,3], 12:[5,3],
             7:[1,5], 6:[2,5], 5:[3,5], 4:[4,5], 3:[5,5]};
let bookings = [];
const $ = id => document.getElementById(id);

/* ---------- date helpers (local time, YYYY-MM-DD) ---------- */
const fmt = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return fmt(d); };
const today = fmt(new Date());
const maxDate = (() => { const d = new Date(); d.setMonth(d.getMonth() + 6); return fmt(d); })();
const start = b => b.check_in_date + ' ' + b.check_in_time;
const end = b => b.check_out_date + ' ' + b.check_out_time;
// A house is occupied on a date if that night falls inside [check-in date, check-out date)
const occupies = (b, d) => b.check_in_date <= d && b.check_out_date > d;

function show(text, ok) {
  const m = $('msg'); m.textContent = text;
  m.className = 'mb-3 rounded px-3 py-2 text-sm ' + (ok ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700');
  setTimeout(() => m.classList.add('hidden'), 6000);
}

/* ---------- Language switching ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('select[name=house_number]').forEach(sel => {
    const cur = sel.value, optional = !!sel.closest('#bookForm');
    sel.innerHTML = '';
    const o0 = document.createElement('option'); o0.value = ''; o0.textContent = t(optional ? 'unassigned' : 'selectHouse'); sel.appendChild(o0);
    for (let n = 1; n <= 12; n++) {
      const o = document.createElement('option'); o.value = n; o.textContent = `${t('houseWord')} ${n} (${TYPES(n)})`; sel.appendChild(o);
    }
    sel.value = cur;
  });
  const on = 'bg-white text-emerald-800 font-semibold';
  document.querySelectorAll('[data-lang]').forEach(b => b.className = 'px-2 py-1 ' + (b.dataset.lang === lang ? on : 'text-white'));
  $('saveBtn').textContent = t('save');
  updateExtra(); render();
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem('pafun_lang', l); } catch (e) {}
  applyLang();
}
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));

/* ---------- API (every call except login carries the session token) ---------- */
const getToken = () => { try { return sessionStorage.getItem('pafun_token'); } catch (e) { return null; } };
async function api(action, data) {
  // text/plain avoids the CORS preflight that Apps Script cannot answer
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...data, action, token: getToken() }) });
  let j;
  try { j = JSON.parse(await r.text()); } catch (e) { throw new Error(t('badResponse')); }
  if (!j.ok && j.error === 'UNAUTHORIZED') { showLogin('sessionExpired'); throw new Error(t('sessionExpired')); }
  return j;
}
let apiVersion = 0, maint = [];   // backend version; edit/cancel need >= 3
async function load() {
  try {
    const j = await api('list');
    if (!j.ok) throw new Error(j.error);
    bookings = j.bookings; maint = j.maintenance || []; apiVersion = j.api_version || 0;
    render();
  } catch (e) { if (getToken()) show(t('loadFail') + e.message, false); }
}
let editingId = null;   // booking_id while editing, otherwise null
const save = payload => api(editingId ? 'update' : 'create', payload);

/* ---------- Login / logout ---------- */
function enterApp() {
  $('loginView').classList.add('hidden'); $('app').classList.remove('hidden');
  render(); load();
}
function showLogin(msgKey) {
  try { sessionStorage.removeItem('pafun_token'); } catch (e) {}
  bookings = []; maint = []; $('layout').innerHTML = '';
  $('app').classList.add('hidden');
  document.querySelectorAll('#formModal,#detailModal,#maintModal').forEach(m => m.classList.add('hidden'));
  $('loginView').classList.remove('hidden');
  const err = $('loginErr');
  if (msgKey) { err.textContent = t(msgKey); err.classList.remove('hidden'); } else err.classList.add('hidden');
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('loginBtn'), err = $('loginErr');
  btn.disabled = true; btn.textContent = t('signingIn'); err.classList.add('hidden');
  try {
    const j = await api('login', { username: $('lUser').value.trim(), password: $('lPass').value });
    if (!j.ok) throw new Error(j.error === 'INVALID_LOGIN' ? t('loginFail') : j.error);
    try { sessionStorage.setItem('pafun_token', j.token); } catch (x) {}
    $('lPass').value = ''; enterApp();
  } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = t('loginBtn');
});
$('logoutBtn').onclick = async () => {
  try { await api('logout'); } catch (e) {}   // best effort: also invalidates the token server-side
  showLogin();
};

/* ---------- Render ---------- */
function render() {
  if (!getToken()) return;   // house map is never built before login
  const d = $('dateSel').value;
  const used = bookings.filter(b => b.extra_bed === 1 && occupies(b, d)).length;
  $('bedBadge').textContent = `${t('beds')}: ${Math.max(0, MAX_EXTRA - used)}/${MAX_EXTRA}`;

  const L = $('layout'); L.innerHTML = '';
  const office = document.createElement('div');
  office.className = 'rounded bg-sky-100 text-sky-800 text-center text-sm font-semibold flex items-center justify-center h-16';
  office.style.gridColumn = 6; office.style.gridRow = 1; office.textContent = t('office');
  L.appendChild(office);
  const road = document.createElement('div');
  road.className = 'text-center text-xs text-stone-400 self-center';
  road.style.gridColumn = '1 / 6'; road.style.gridRow = 4; road.textContent = t('walkway');
  L.appendChild(road);

  for (let n = 1; n <= 12; n++) {
    const b = bookings.find(x => x.house_number === n && occupies(x, d));
    const m = !b && maint.find(x => x.house_number === n && x.start_date <= d && d <= x.end_date);
    const el = document.createElement('button');
    el.className = 'house h-24 rounded-lg shadow flex flex-col items-center justify-center ' + (b ? 'bg-red-500 text-white' : m ? 'bg-yellow-400 text-stone-900' : 'bg-emerald-500 text-white');
    el.style.gridColumn = POS[n][0]; el.style.gridRow = POS[n][1];
    el.innerHTML = `<span class="text-3xl font-bold">${n}</span><span class="text-xs opacity-90">${m ? '🔧 ' + t('repairLabel') : TYPES(n)}</span>`;
    el.onclick = () => b ? openDetails(b) : m ? openMaintDetails(m) : openForm(n);
    L.appendChild(el);
  }
}

/* ---------- Details modal ---------- */
let currentBooking = null, currentMaint = null, editingMaintId = null;
function setCancelLabel(k) { const b = $('cancelBtn'); b.dataset.i18n = k; b.textContent = t(k); }
function openMaintDetails(m) {
  currentMaint = m; currentBooking = null; $('cancelErr').classList.add('hidden'); setCancelLabel('cancelMaint');
  $('dTitle').textContent = `${t('houseWord')} ${m.house_number} · ${m.maintenance_id}`;
  const rows = [[t('status'), '🔧 ' + t('repairLabel')], [t('startLbl'), m.start_date], [t('endLbl'), m.end_date], [t('repairNote'), m.note || '-']];
  $('dBody').innerHTML = '';
  rows.forEach(([k, v]) => {
    const dt = document.createElement('dt'); dt.className = 'text-stone-500'; dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    $('dBody').append(dt, dd);
  });
  $('detailModal').classList.remove('hidden');
}
function openDetails(b) {
  currentBooking = b; currentMaint = null; setCancelLabel('cancelBooking'); $('cancelErr').classList.add('hidden');
  $('dTitle').textContent = `${t('houseWord')} ${b.house_number} · ${b.booking_id}`;
  const rows = [[t('name'), b.customer_name], [t('phone'), b.phone_number], [t('checkIn'), start(b)], [t('checkOut'), end(b)],
    [t('extraBed'), b.extra_bed ? t('yes') : t('no')], [t('purpose'), b.purpose || '-']];
  $('dBody').innerHTML = '';
  rows.forEach(([k, v]) => {
    const dt = document.createElement('dt'); dt.className = 'text-stone-500'; dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;   // textContent = safe from HTML injection
    $('dBody').append(dt, dd);
  });
  $('detailModal').classList.remove('hidden');
}

const outdated = min => {
  if (apiVersion >= (min || 3)) return false;
  const e = $('cancelErr'); e.textContent = t('outdated'); e.classList.remove('hidden'); return true;
};
$('editBtn').onclick = () => {
  if (currentMaint) {
    if (outdated(4)) return;
    $('detailModal').classList.add('hidden'); openMaintForm(currentMaint.house_number, currentMaint); return;
  }
  if (outdated()) return;
  $('detailModal').classList.add('hidden');
  openForm(currentBooking.house_number, currentBooking);
};
$('cancelBtn').onclick = async () => {
  const isM = !!currentMaint, item = isM ? currentMaint : currentBooking;
  if (!item || outdated(isM ? 4 : 3) || !confirm(t(isM ? 'confirmMaint' : 'confirmCancel'))) return;
  const btn = $('cancelBtn'), err = $('cancelErr'), label = btn.textContent;
  btn.disabled = true; btn.textContent = t('cancelling'); err.classList.add('hidden');
  try {
    const j = isM ? await api('delete_maint', { maintenance_id: item.maintenance_id })
                  : await api('cancel', { booking_id: item.booking_id });
    if (!j.ok) throw new Error(j.error);
    $('detailModal').classList.add('hidden');
    show(t(isM ? 'maintDeleted' : 'cancelled') + (isM ? item.maintenance_id : item.booking_id), true);
    await load();
  } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = label;
};

/* ---------- Form modal ---------- */
const F = () => $('bookForm').elements;
function openForm(house, b) {
  $('bookForm').reset(); $('formErr').classList.add('hidden');
  const f = F(), d = $('dateSel').value;
  editingId = b ? b.booking_id : null;
  $('toRepairBtn').classList.toggle('hidden', !!b);
  $('formTitle').dataset.i18n = b ? 'editBooking' : 'newBooking';
  $('formTitle').textContent = t(b ? 'editBooking' : 'newBooking');
  f.house_number.value = house || '';
  f.check_in_date.value = b ? b.check_in_date : d; f.check_out_date.value = b ? b.check_out_date : addDays(d, 1);
  if (b) {
    f.customer_name.value = b.customer_name; f.phone_number.value = b.phone_number;
    f.check_in_time.value = b.check_in_time; f.check_out_time.value = b.check_out_time;
    f.extra_bed.checked = b.extra_bed === 1; f.purpose.value = b.purpose || '';
  }
  f.check_in_date.min = addDays(today, -30); f.check_in_date.max = maxDate;
  f.check_out_date.max = addDays(maxDate, 1);
  updateExtra();
  $('formModal').classList.remove('hidden');
}
// Disable extra bed if capacity for the chosen range is exhausted
function updateExtra() {
  const f = F();
  const probe = { check_in_date: f.check_in_date.value, check_in_time: f.check_in_time.value,
                  check_out_date: f.check_out_date.value, check_out_time: f.check_out_time.value };
  const used = bookings.filter(b => b.extra_bed === 1 && b.booking_id !== editingId && start(probe) < end(b) && end(probe) > start(b)).length;
  const left = Math.max(0, MAX_EXTRA - used);
  $('extraBed').disabled = left === 0;
  if (left === 0) $('extraBed').checked = false;
  $('extraHint').textContent = '(' + t('leftFor').replace('{n}', left).replace('{m}', MAX_EXTRA) + ')';
}

$('bookForm').addEventListener('input', updateExtra);
$('bookForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = F(), btn = $('saveBtn'), err = $('formErr');
  const payload = {
    customer_name: f.customer_name.value, phone_number: f.phone_number.value,
    house_number: f.house_number.value ? Number(f.house_number.value) : null,
    check_in_date: f.check_in_date.value, check_in_time: f.check_in_time.value,
    check_out_date: f.check_out_date.value, check_out_time: f.check_out_time.value,
    extra_bed: f.extra_bed.checked ? 1 : 0, purpose: f.purpose.value, booking_id: editingId || undefined
  };
  btn.disabled = true; btn.textContent = t('saving'); err.classList.add('hidden');
  try {
    const j = await save(payload);
    if (!j.ok) throw new Error(j.error);
    $('formModal').classList.add('hidden');
    show(t(editingId ? 'updated' : 'saved') + j.booking.booking_id, true);
    await load();
  } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = t('save');
});

/* ---------- Maintenance (repair) form ---------- */
function openMaintForm(house, m) {
  const f = $('maintForm').elements, d = $('dateSel').value;
  $('maintForm').reset(); $('maintErr').classList.add('hidden');
  editingMaintId = m ? m.maintenance_id : null;
  $('maintTitle').dataset.i18n = m ? 'editMaint' : 'maintTitle';
  $('maintTitle').textContent = t(m ? 'editMaint' : 'maintTitle');
  f.house_number.value = house || '';
  f.start_date.value = m ? m.start_date : d; f.end_date.value = m ? m.end_date : d;
  f.note.value = m ? m.note : '';
  f.start_date.min = addDays(today, -30); f.start_date.max = maxDate; f.end_date.max = addDays(maxDate, 1);
  $('maintModal').classList.remove('hidden');
}
$('maintOpen').onclick = () => openMaintForm('');
$('toRepairBtn').onclick = () => { const hn = F().house_number.value; $('formModal').classList.add('hidden'); openMaintForm(hn); };
$('maintForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = $('maintForm').elements, btn = $('maintSave'), err = $('maintErr');
  if (apiVersion < 4) { err.textContent = t('outdated'); err.classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = t('saving'); err.classList.add('hidden');
  try {
    const j = await api(editingMaintId ? 'update_maint' : 'create_maint', {
      maintenance_id: editingMaintId || undefined, house_number: Number(f.house_number.value),
      start_date: f.start_date.value, end_date: f.end_date.value, note: f.note.value });
    if (!j.ok) throw new Error(j.error);
    $('maintModal').classList.add('hidden');
    show(t(editingMaintId ? 'maintUpdated' : 'maintSaved') + j.maintenance.maintenance_id, true);
    await load();
  } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = t('save');
});

/* ---------- Init ---------- */
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => document.querySelectorAll('#formModal,#detailModal,#maintModal').forEach(m => m.classList.add('hidden')));
const ds = $('dateSel'); ds.min = addDays(today, -30); ds.max = maxDate; ds.value = today;
ds.addEventListener('change', render);
applyLang();
getToken() ? enterApp() : showLogin();
</script>
</body>
</html>
