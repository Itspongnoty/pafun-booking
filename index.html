const TYPES = n => t(n <= 7 ? 'single' : n <= 11 ? 'double' : 'special');

const RATE = n => n <= 7 ? 890 : 990;
const bookingRate = b => b.rate_per_night || RATE(b.house_number);
const typeFull = n => n === 12 ? t('specialFull') : TYPES(n);
const money = n => n.toLocaleString('en-US') + ' ' + t('currency');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nightsBetween = (ci, co) => (ci && co) ? Math.max(0, Math.round((new Date(co + 'T00:00') - new Date(ci + 'T00:00')) / 864e5)) : 0;
const bookingOn = (n, d) => bookings.find(x => x.house_number === n && occupies(x, d));
const repairOn = (n, d) => maint.find(x => x.house_number === n && x.start_date <= d && d <= x.end_date);

const POS = {1:[6,2], 2:[6,3], 8:[1,3], 9:[2,3], 10:[3,3], 11:[4,3], 12:[5,3],
             7:[1,5], 6:[2,5], 5:[3,5], 4:[4,5], 3:[5,5]};
let bookings = [], userRole = 'staff';
const $ = id => document.getElementById(id);

const fmt = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return fmt(d); };
const today = fmt(new Date());
const maxDate = (() => { const d = new Date(); d.setMonth(d.getMonth() + 6); return fmt(d); })();
const start = b => b.check_in_date + ' ' + b.check_in_time;
const end = b => b.check_out_date + ' ' + b.check_out_time;
const occupies = (b, d) => b.check_in_date <= d && b.check_out_date > d;

function show(text, ok) {
  const m = $('msg'); m.textContent = text;
  m.className = 'mb-3 rounded px-3 py-2 text-sm ' + (ok ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700');
  setTimeout(() => m.classList.add('hidden'), 6000);
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('select[name=house_number]').forEach(sel => {
    const cur = sel.value, optional = !!sel.closest('#bookForm');
    sel.innerHTML = '';
    const o0 = document.createElement('option'); o0.value = ''; o0.textContent = t(optional ? 'unassigned' : 'selectHouse'); sel.appendChild(o0);
    for (let n = 1; n <= 12; n++) {
      const o = document.createElement('option'); o.value = n; o.textContent = `${t('houseWord')} ${n} (${TYPES(n)})`; sel.appendChild(o);
    }
    sel.value = cur;
  });
  const on = 'bg-white text-emerald-800 font-semibold';
  document.querySelectorAll('[data-lang]').forEach(b => b.className = 'px-2 py-1 ' + (b.dataset.lang === lang ? on : 'text-white'));
  $('saveBtn').textContent = t('save');
  updateExtra(); render();
  if (!$('monthModal').classList.contains('hidden')) renderMonth();
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem('pafun_lang', l); } catch (e) {}
  applyLang();
}
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));

const getToken = () => { try { return sessionStorage.getItem('pafun_token'); } catch (e) { return null; } };
async function api(action, data) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...data, action, token: getToken() }) });
  let j;
  try { j = JSON.parse(await r.text()); } catch (e) { throw new Error(t('badResponse')); }
  if (!j.ok && j.error === 'UNAUTHORIZED') { showLogin('sessionExpired'); throw new Error(t('sessionExpired')); }
  return j;
}
let apiVersion = 0, maint = [], incomeMonthly = null;
async function load() {
  try {
    const j = await api('list');
    if (!j.ok) throw new Error(j.error);
    bookings = j.bookings; maint = j.maintenance || []; apiVersion = j.api_version || 0;
    userRole = j.role || 'staff';
    incomeMonthly = j.income_monthly ? Object.fromEntries(j.income_monthly.map(x => [x.month, x])) : null;
    render();
  } catch (e) { if (getToken()) show(t('loadFail') + e.message, false); }
}
let editingId = null;
const save = payload => api(editingId ? 'update' : 'create', payload);

function enterApp() {
  $('loginView').classList.add('hidden'); $('app').classList.remove('hidden');
  render(); load();
}
function showLogin(msgKey) {
  try { sessionStorage.removeItem('pafun_token'); } catch (e) {}
  bookings = []; maint = []; incomeMonthly = null; $('layout').innerHTML = '';
  $('app').classList.add('hidden');
  document.querySelectorAll('#formModal,#detailModal,#maintModal,#monthModal').forEach(m => m.classList.add('hidden'));
  $('loginView').classList.remove('hidden');
  const err = $('loginErr');
  if (msgKey) { err.textContent = t(msgKey); err.classList.remove('hidden'); } else err.classList.add('hidden');
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('loginBtn'), err = $('loginErr');
  btn.disabled = true; btn.textContent = t('signingIn'); err.classList.add('hidden');
  try {
    const j = await api('login', { username: $('lUser').value.trim(), password: $('lPass').value });
    if (!j.ok) throw new Error(j.error === 'INVALID_LOGIN' ? t('loginFail') : j.error);
    try { sessionStorage.setItem('pafun_token', j.token); } catch (x) {}
    userRole = j.role || 'staff';
    $('lPass').value = ''; enterApp();
  } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = t('loginBtn');
});
$('logoutBtn').onclick = async () => {
  try { await api('logout'); } catch (e) {}
  showLogin();
};

function render() {
  if (!getToken()) return;
  const d = $('dateSel').value;
  const used = bookings.filter(b => b.extra_bed === 1 && occupies(b, d)).length;
  const badge = $('bedBadge');
  const remaining = Math.max(0, MAX_EXTRA - used);
  if (remaining === 0) {
    badge.textContent = `⚠️ ${t('beds')}: 0/${MAX_EXTRA}`;
    badge.className = 'bg-red-600 text-white text-xs font-bold rounded-full px-3 py-1 shadow border border-white animate-pulse';
  } else {
    badge.textContent = `${t('beds')}: ${remaining}/${MAX_EXTRA}`;
    badge.className = 'bg-amber-300 text-stone-900 text-sm font-semibold rounded-full px-3 py-1';
  }

  const L = $('layout'); L.innerHTML = '';
  const office = document.createElement('div');
  office.className = 'rounded bg-sky-100 text-sky-800 text-center text-sm font-semibold flex items-center justify-center h-16';
  office.style.gridColumn = 6; office.style.gridRow = 1; office.textContent = t('office');
  L.appendChild(office);
  const road = document.createElement('div');
  road.className = 'text-center text-xs text-stone-400 self-center';
  road.style.gridColumn = '1 / 6'; road.style.gridRow = 4; road.textContent = t('walkway');
  L.appendChild(road);

  for (let n = 1; n <= 12; n++) {
    const b = bookings.find(x => x.house_number === n && occupies(x, d));
    const m = !b && maint.find(x => x.house_number === n && x.start_date <= d && d <= x.end_date);
    const el = document.createElement('button');
    el.className = 'house st-' + (b ? 'booked' : m ? 'repair' : 'free') + ' h-24 rounded-lg shadow flex flex-col items-center justify-center relative ' + (b ? 'bg-red-500 text-white' : m ? 'bg-yellow-400 text-stone-900' : 'bg-emerald-500 text-white');
    el.style.gridColumn = POS[n][0]; el.style.gridRow = POS[n][1];
    
    let extraTag = (b && b.extra_bed === 1) ? `<span class="text-[10px] bg-amber-200 text-amber-900 font-bold px-1 rounded mt-0.5 shadow-sm">🛏️ เตียงเสริม</span>` : '';
    el.innerHTML = `<span class="text-3xl font-bold">${n}</span><span class="text-xs opacity-90">${m ? '🔧 ' + t('repairLabel') : TYPES(n)}</span>${extraTag}<span class="print-only text-xs font-bold">${t(b ? 'stBooked' : m ? 'stRepair' : 'stFree')}</span>${b ? '<span class="print-only text-[10px]">' + esc(b.customer_name) + '</span>' : ''}`;
    el.onclick = () => b ? openDetails(b) : m ? openMaintDetails(m) : openForm(n);
    L.appendChild(el);
  }
  buildSummary($('summary'), d);
  $('printDate').textContent = t('stayDate') + ': ' + d;
}

function buildSummary(el, d) {
  const free = [], st = { booked: 0, repair: 0 };
  for (let n = 1; n <= 12; n++) {
    if (bookingOn(n, d)) st.booked++; else if (repairOn(n, d)) st.repair++; else free.push(n);
  }
  const chips = list => list.length
    ? list.map(n => `<span class="chip inline-block rounded border border-emerald-600 bg-emerald-50 text-emerald-800 px-2 mx-0.5 font-semibold">${n}</span>`).join('')
    : `<span class="text-stone-500">${t('none')}</span>`;
  el.innerHTML = `<div class="rounded border bg-white p-3 text-sm space-y-1">
    <div class="font-bold text-base">${t('stayDate')}: ${d} · ${t('availRooms')}: ${free.length}/12 ${t('rooms')}</div>
    <div class="text-stone-500">${t('bookedN')} ${st.booked} · 🔧 ${t('repairLabel')} ${st.repair}</div>
    <div>${t('singleCat')}: ${chips(free.filter(n => n <= 7))}</div>
    <div>${t('doubleCat')}: ${chips(free.filter(n => n >= 8))}</div>
  </div>`;
}

let currentBooking = null, currentMaint = null, editingMaintId = null;
function setCancelLabel(k) { const b = $('cancelBtn'); b.dataset.i18n = k; b.textContent = t(k); }
function openMaintDetails(m) {
  currentMaint = m; currentBooking = null; $('cancelErr').classList.add('hidden'); setCancelLabel('cancelMaint');
  $('dTitle').textContent = `${t('houseWord')} ${m.house_number} · ${m.maintenance_id}`;
  const rows = [[t('status'), '🔧 ' + t('repairLabel')], [t('startLbl'), m.start_date], [t('endLbl'), m.end_date], [t('repairNote'), m.note || '-']];
  $('dBody').innerHTML = '';
  rows.forEach(([k, v]) => {
    const dt = document.createElement('dt'); dt.className = 'text-stone-500'; dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    $('dBody').append(dt, dd);
  });
  $('detailModal').classList.remove('hidden');
}
function openDetails(b) {
  currentBooking = b; currentMaint = null; setCancelLabel('cancelBooking'); $('cancelErr').classList.add('hidden');
  $('dTitle').textContent = `${t('houseWord')} ${b.house_number} · ${b.booking_id}`;
  
  const channelText = b.booking_type === 'Walk-in' ? t('walkInChannel') : t('bookingChannel');
  const rows = [
    [t('bookingType'), channelText],
    [t('name'), b.customer_name],
    [t('phone'), b.phone_number],
    [t('checkIn'), start(b)],
    [t('checkOut'), end(b)],
    [t('extraBed'), b.extra_bed === 1 ? `${t('yes')} (+400/คืน)` : t('no')],
    [t('purpose'), b.purpose || '-']
  ];

  if (b.house_number) {
    const nn = nightsBetween(b.check_in_date, b.check_out_date), r = bookingRate(b);
    const roomCost = nn * r;
    const extraCost = b.extra_bed === 1 ? nn * EXTRA_BED_RATE : 0;
    const total = b.total_price != null ? b.total_price : (roomCost + extraCost);
    rows.splice(5, 0, [t('roomType'), typeFull(b.house_number)], [t('nights'), nn], [t('roomCost'), money(roomCost)]);
    if (b.extra_bed === 1) rows.splice(8, 0, [t('extraBedCost'), money(extraCost)]);
    rows.splice(rows.length - 1, 0, [t('totalCost'), money(total)]);
  }
  $('dBody').innerHTML = '';
  rows.forEach(([k, v]) => {
    const dt = document.createElement('dt'); dt.className = 'text-stone-500'; dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    if (k === t('bookingType')) dd.className = 'font-bold text-emerald-700';
    if (k === t('totalCost')) dd.className = 'font-bold text-emerald-800';
    $('dBody').append(dt, dd);
  });
  $('detailModal').classList.remove('hidden');
}

const outdated = min => {
  if (apiVersion >= (min || 3)) return false;
  const e = $('cancelErr'); e.textContent = t('outdated'); e.classList.remove('hidden'); return true;
};
$('editBtn').onclick = () => {
  if (currentMaint) {
    if (outdated(4)) return;
    $('detailModal').classList.add('hidden'); openMaintForm(currentMaint.house_number, currentMaint); return;
  }
  if (outdated()) return;
  $('detailModal').classList.add('hidden');
  openForm(currentBooking.house_number, currentBooking);
};
$('cancelBtn').onclick = async () => {
  const isM = !!currentMaint, item = isM ? currentMaint : currentBooking;
  if (!item || outdated(isM ? 4 : 3) || !confirm(t(isM ? 'confirmMaint' : 'confirmCancel'))) return;
  const btn = $('cancelBtn'), err = $('cancelErr'), label = btn.textContent;
  btn.disabled = true; btn.textContent = t('cancelling'); err.classList.add('hidden');
  try {
    const j = isM ? await api('delete_maint', { maintenance_id: item.maintenance_id })
                  : await api('cancel', { booking_id: item.booking_id });
    if (!j.ok) throw new Error(j.error);
    $('detailModal').classList.add('hidden');
    show(t(isM ? 'maintDeleted' : 'cancelled') + (isM ? item.maintenance_id : item.booking_id), true);
    await load();
  } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = label;
};

const F = () => $('bookForm').elements;
let lastNightsDuration = 1;

function openForm(house, b) {
  $('bookForm').reset(); $('formErr').classList.add('hidden');
  const f = F(), d = $('dateSel').value;
  editingId = b ? b.booking_id : null;
  $('toRepairBtn').classList.toggle('hidden', !!b);
  $('formTitle').dataset.i18n = b ? 'editBooking' : 'newBooking';
  $('formTitle').textContent = t(b ? 'editBooking' : 'newBooking');
  
  f.booking_type.value = b && b.booking_type ? b.booking_type : 'Booking';
  f.house_number.value = house || '';
  f.check_in_date.value = b ? b.check_in_date : d; f.check_out_date.value = b ? b.check_out_date : addDays(d, 1);
  if (b) {
    f.customer_name.value = b.customer_name; f.phone_number.value = b.phone_number;
    f.check_in_time.value = b.check_in_time; f.check_out_time.value = b.check_out_time;
    f.extra_bed.checked = b.extra_bed === 1; f.purpose.value = b.purpose || '';
  }
  f.check_in_date.min = addDays(today, -30); f.check_in_date.max = maxDate;
  f.check_out_date.max = addDays(maxDate, 1);
  lastNightsDuration = nightsBetween(f.check_in_date.value, f.check_out_date.value) || 1;
  updateExtra();
  $('formModal').classList.remove('hidden');
}

// Smart Check-out Date Auto-Shift
$('ciDateInput').addEventListener('change', () => {
  const f = F();
  const ci = f.check_in_date.value;
  if (ci) {
    f.check_out_date.value = addDays(ci, lastNightsDuration);
    updateExtra();
  }
});
$('coDateInput').addEventListener('change', () => {
  const f = F();
  const nn = nightsBetween(f.check_in_date.value, f.check_out_date.value);
  if (nn > 0) lastNightsDuration = nn;
  updateExtra();
});

function updateExtra() {
  const f = F();
  const probe = { check_in_date: f.check_in_date.value, check_in_time: f.check_in_time.value,
                  check_out_date: f.check_out_date.value, check_out_time: f.check_out_time.value };
  const used = bookings.filter(b => b.extra_bed === 1 && b.booking_id !== editingId && start(probe) < end(b) && end(probe) > start(b)).length;
  const left = Math.max(0, MAX_EXTRA - used);
  $('extraBed').disabled = left === 0;
  if (left === 0) {
    $('extraBed').checked = false;
    $('extraHint').textContent = `(${t('bedFullWarning')})`;
    $('extraHint').className = 'text-red-600 font-bold';
  } else {
    $('extraHint').textContent = '(' + t('leftFor').replace('{n}', left).replace('{m}', MAX_EXTRA) + ')';
    $('extraHint').className = 'text-stone-500';
  }
  updatePrice();
}

function updatePrice() {
  const f = F(), n = Number(f.house_number.value) || 0;
  const nn = nightsBetween(f.check_in_date.value, f.check_out_date.value);
  const isExtra = f.extra_bed.checked;
  let html = `<div>${t('nights')}: <b>${nn}</b> ${t('perNight')}</div>`;
  const orig = editingId && bookings.find(x => x.booking_id === editingId);
  const rate = n ? ((orig && orig.house_number === n && orig.rate_per_night) || RATE(n)) : 0;
  const roomCost = nn * rate;
  const extraCost = isExtra ? nn * EXTRA_BED_RATE : 0;
  const total = roomCost + extraCost;

  if (n) {
    html += `<div>${typeFull(n)} · ${t('rate')}: ${money(rate)} / ${t('perNight')} (${money(roomCost)})</div>`;
    if (isExtra) html += `<div class="text-amber-700 font-medium">🛏️ ${t('extraBedCost')}: ${money(EXTRA_BED_RATE)} × ${nn} คืน = ${money(extraCost)}</div>`;
    html += `<div class="font-bold text-base mt-1 border-t pt-1">${t('totalCost')}: ${money(total)}</div>`;
  } else html += `<div class="text-stone-500">${t('pickHouse')}</div>`;
  $('priceBox').innerHTML = html;
}

$('bookForm').addEventListener('input', updateExtra);

let mY = 0, mM = 0, mSel = null;
const pad2 = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
const WEEKDAYS = { th: ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };

const mIdx = (y, m) => y * 12 + m;
const [tY, tM] = today.split('-').map(Number);
const MIN_M = mIdx(tY, tM - 1 - 1), MAX_M = mIdx(tY, tM - 1 + 6);
function openMonth() {
  const [y, m] = $('dateSel').value.split('-').map(Number);
  const idx = Math.min(MAX_M, Math.max(MIN_M, mIdx(y, m - 1)));
  mY = Math.floor(idx / 12); mM = idx % 12;
  mSel = $('dateSel').value.slice(0, 7) === `${mY}-${pad2(mM + 1)}` ? $('dateSel').value : ymd(mY, mM, 1);
  renderMonth(); $('monthModal').classList.remove('hidden');
}
function shiftMonth(k) {
  const idx = mIdx(mY, mM) + k;
  if (idx < MIN_M || idx > MAX_M) return;
  mY = Math.floor(idx / 12); mM = idx % 12;
  mSel = today.slice(0, 7) === `${mY}-${pad2(mM + 1)}` ? today : ymd(mY, mM, 1);
  renderMonth();
}
function renderMonth() {
  const loc = lang === 'th' ? 'th-TH' : 'en-US';
  const cur = mIdx(mY, mM);
  [['mPrev', cur <= MIN_M], ['mNext', cur >= MAX_M]].forEach(([id, off]) => {
    $(id).disabled = off; $(id).classList.toggle('opacity-40', off);
  });
  $('mTitle').textContent = new Date(mY, mM, 1).toLocaleDateString(loc, { month: 'long', year: 'numeric' });
  const days = new Date(mY, mM + 1, 0).getDate(), first = new Date(mY, mM, 1).getDay();
  let html = '<div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-stone-500 mb-1">' +
    WEEKDAYS[lang].map(w => `<div>${w}</div>`).join('') + '</div><div class="grid grid-cols-7 gap-1">';
  for (let i = 0; i < first; i++) html += '<div></div>';
  for (let day = 1; day <= days; day++) {
    const d = ymd(mY, mM, day);
    let nb = 0, nr = 0, sq = '';
    for (let n = 1; n <= 12; n++) {
      const b = bookingOn(n, d), r = !b && repairOn(n, d);
      if (b) nb++; else if (r) nr++;
      const cls = b ? 'm-booked bg-red-500 text-white' : r ? 'm-repair bg-yellow-400 text-stone-900' : 'm-free bg-emerald-400 text-white';
      const tip = b ? `${n}: ${esc(b.customer_name)}` : r ? `${n}: ${t('repairLabel')}` : `${n}: ${t('stFree')}`;
      sq += `<span title="${tip}" class="m-sq ${cls} text-[8px] leading-4 text-center rounded-sm">${n}</span>`;
    }
    const ring = d === mSel ? ' ring-2 ring-emerald-600' : '', now = d === today ? ' bg-emerald-50 border-emerald-600' : ' bg-white';
    html += `<button type="button" data-day="${d}" class="border rounded p-1 text-left touch-manipulation${now}${ring}">
      <div class="flex justify-between text-xs"><b>${day}</b><span>${nb}/12${nr ? ' · 🔧' + nr : ''}</span></div>
      <div class="grid grid-cols-6 gap-px mt-1">${sq}</div></button>`;
  }
  $('mGrid').innerHTML = html + '</div>';

  buildSummary($('mDay'), mSel);

  const ms = ymd(mY, mM, 1), me = ymd(mY, mM, days);
  const nx = new Date(mY, mM + 1, 1), msNext = ymd(nx.getFullYear(), nx.getMonth(), 1);
  const inMonth = (ci, co) => nightsBetween(ci > ms ? ci : ms, co < msNext ? co : msNext);
  const rows = []; let noHouse = 0;
  
  const showIncome = userRole === 'owner';

  bookings.filter(b => b.check_in_date <= me && b.check_out_date > ms)
    .sort((a, b) => start(a) < start(b) ? -1 : 1).forEach(b => {
      const nn = inMonth(b.check_in_date, b.check_out_date);
      let amt = '-';
      if (b.house_number) {
        const extraCost = b.extra_bed === 1 ? nn * EXTRA_BED_RATE : 0;
        amt = ((nn * bookingRate(b)) + extraCost).toLocaleString('en-US');
      } else noHouse++;
      
      if (showIncome) rows.push([b.house_number || '-', esc(b.customer_name), start(b), end(b), nn, amt]);
      else rows.push([b.house_number || '-', esc(b.customer_name), start(b), end(b), nn]);
    });
  maint.filter(x => x.start_date <= me && x.end_date >= ms).forEach(x => {
    if (showIncome) rows.push([x.house_number, '🔧 ' + t('repairLabel') + (x.note ? ' – ' + esc(x.note) : ''), x.start_date, x.end_date, '-', '-']);
    else rows.push([x.house_number, '🔧 ' + t('repairLabel') + (x.note ? ' – ' + esc(x.note) : ''), x.start_date, x.end_date, '-']);
  });

  if (!showIncome) {
    $('mIncome').innerHTML = '';
  } else if (!incomeMonthly) {
    $('mIncome').innerHTML = `<p class="text-sm text-red-600">${t('outdated')}</p>`;
  } else {
    const im = incomeMonthly[`${mY}-${pad2(mM + 1)}`] ||
      { room_income: 0, nights_sold: 0, occupancy_pct: 0, single_income: 0, double_income: 0 };
    $('mIncome').innerHTML = `<div class="rounded border bg-white p-3 text-sm space-y-1">
      <div class="font-bold text-base text-emerald-800">${t('monthIncome')}: ${money(im.room_income)}</div>
      <div>${t('nightsSold')}: ${im.nights_sold} · ${t('occupancy')}: ${im.occupancy_pct}%</div>
      <div class="text-xs text-stone-500">${t('incomeNote')}${noHouse ? ' · ' + t('noHouseNote').replace('{n}', noHouse) : ''}</div>
    </div>`;
  }

  const ths = showIncome
    ? [t('colHouse'), t('colName'), t('checkIn'), t('checkOut'), t('colNightsM'), t('colIncomeM')]
    : [t('colHouse'), t('colName'), t('checkIn'), t('checkOut'), t('colNightsM')];

  $('mList').innerHTML = rows.length
    ? `<table class="w-full text-sm border-collapse"><thead><tr class="bg-stone-100 text-left">` +
      ths.map(c => `<th class="border px-2 py-1">${c}</th>`).join('') +
      `</tr></thead><tbody>` + rows.map(r => '<tr>' + r.map(c => `<td class="border px-2 py-1">${c}</td>`).join('') + '</tr>').join('') + `</tbody></table>`
    : `<p class="text-sm text-stone-500">${t('noItems')}</p>`;
}

function gotoDay(d) {
  const ds = $('dateSel');
  ds.value = d < ds.min ? ds.min : d > ds.max ? ds.max : d;
  $('monthModal').classList.add('hidden');
  render();
}
function selectDay(d) {
  mSel = d;
  $('mGrid').querySelectorAll('[data-day]').forEach(c => {
    const on = c.dataset.day === d;
    c.classList.toggle('ring-2', on); c.classList.toggle('ring-emerald-600', on);
  });
  buildSummary($('mDay'), d);
}
let lastTap = { d: null, t: 0 };
$('mGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-day]'); if (!b) return;
  const d = b.dataset.day, now = Date.now();
  if (lastTap.d === d && now - lastTap.t < 500) { lastTap = { d: null, t: 0 }; gotoDay(d); return; }
  lastTap = { d, t: now };
  selectDay(d);
});
$('monthOpen').onclick = openMonth;
$('mPrev').onclick = () => shiftMonth(-1);
$('mNext').onclick = () => shiftMonth(1);

function doPrint(mode) {
  document.body.classList.remove('print-daily', 'print-month');
  document.body.classList.add('print-' + mode);
  window.print();
}
$('printDaily').onclick = () => doPrint('daily');
$('printMonth').onclick = () => doPrint('month');

document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => document.querySelectorAll('#formModal,#detailModal,#maintModal,#monthModal').forEach(m => m.classList.add('hidden')));
const ds = $('dateSel'); ds.min = addDays(today, -30); ds.max = maxDate; ds.value = today;
ds.addEventListener('change', render);
applyLang();
getToken() ? enterApp() : showLogin();
</script>
</body>
</html>
